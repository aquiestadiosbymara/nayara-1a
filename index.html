
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1:1 Nayara</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff0f6;
    font-family: 'Nunito', sans-serif;
    color: #54283e;
    min-height: 100vh;
    padding: 30px 16px;
}

header {
    text-align: center;
    margin-bottom: 34px;
}

h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 68px;
    color: #e84f91;
    margin-bottom: 12px;
}

.horario {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: #fbd1e2;
    padding: 9px 17px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 800;
}

.punto {
    width: 9px;
    height: 9px;
    background: #e84f91;
    border-radius: 50%;
}

.contenedor {
    max-width: 682px;
    margin: auto;
    background: #fffafd;
    border: 1.5px solid #f6b4d0;
    border-radius: 30px;
    padding: 28px 26px;
    box-shadow: 0 17px 27px rgba(216,91,145,0.17);
}

h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    margin-bottom: 3px;
}

.descripcion {
    color: #9c637e;
    font-size: 15px;
    margin-bottom: 23px;
    font-weight: 600;
}

.tarjeta {
    padding: 20px;
    background: #fff0f6;
    border: 1.5px solid #f6b4d0;
    border-radius: 21px;
}

.cabecera-tarjeta {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 17px;
}

.icono {
    width: 55px;
    height: 55px;
    min-width: 55px;
    border-radius: 50%;
    background: #fbd1e2;
    color: #e84f91;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
}

h3 {
    font-size: 18px;
    margin-bottom: 4px;
}

.texto p {
    color: #9c637e;
    font-size: 14px;
    line-height: 1.6;
    font-weight: 600;
}

.video {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 15px;
    display: block;
    margin-top: 17px;
}

@media(max-width: 560px) {
    h1 {
        font-size: 55px;
    }

    .contenedor {
        padding: 23px 17px;
    }

    .tarjeta {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>1:1 Nayara</h1>

    <div class="horario">
        <span class="punto"></span>
        Nuestras clases: martes y jueves, 18:00
    </div>
</header>

<main class="contenedor">

    <h2>Recursos</h2>

    <p class="descripcion">
        Todo lo que preparo para ti, en un solo lugar.
    </p>

    <article class="tarjeta">

        <div class="cabecera-tarjeta">

            <div class="icono">♫</div>

            <div class="texto">
                <h3>Abre el corazón</h3>

                <p>
                    Tu meditación personalizada. Hecha por mí,
                    pensada solo para ti y canalizada con mensajes
                    de Dios. Escúchala antes de nuestra siguiente clase.
                </p>
            </div>

        </div>

        <iframe
            class="video"
            src="https://www.youtube.com/embed/VaStPUczbEY"
            title="Abre el corazón - Meditación Nayara"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>

    </article>

</main>

</body>
</html>
